data:
  root: datasets/heuristic-v1
  val_fraction: 0.1
  batch_size: 256
  num_workers: 0
model:
  network: resnet
  board_channels: 2
  hidden_dim: 256
  dropout: 0.0
train:
  epochs: 30
  lr: 3.0e-4
  weight_decay: 1.0e-5
  label_smoothing: 0.02
  early_stopping_patience: 5
  topk_soft_targets: 3
  topk_temperature: 0.5
  grad_clip: 1.0
checkpoint:
  dir: checkpoints/il
  save_best_only: true
metrics:
  # 注意：教師標籤有 20.8% 的「前兩名差距 < 0.5 分」等價情況，
  # 因此 top-1 精確匹配有結構性上限（詳見 docs/12_known_issues.md）。
  # 29k 樣本實測：top1 0.485 / top3 0.734 / top1_tolerant 0.518
  target_top1: 0.45
  target_top3: 0.70
  target_top1_tolerant: 0.50
